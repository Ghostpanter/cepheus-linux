# systemd-battery-check only runs in the initrd (AssertPathExists=/etc/initrd-release)
# and uses FailureAction=poweroff-force if the fuel gauge looks empty.
# This rootfs drop-in cannot change the already-built initramfs. To disable
# that boot-time force-poweroff, add systemd.battery_check=0 to the kernel
# cmdline the next time boot.img is rebuilt. Do not flash from this file.
