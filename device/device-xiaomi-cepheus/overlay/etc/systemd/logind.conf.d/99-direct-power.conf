# Direct external power (battery bypassed): never suspend/hibernate/poweroff
# from lid, power/suspend keys, or idle. HandlePowerKey is already ignore
# in postmarketos-base; this locks the remaining logind actions down.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleRebootKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
